name: navidrome

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  navidrome:
    image: ghcr.io/navidrome/navidrome:0.64.2
    container_name: navidrome
    restart: unless-stopped
    stop_grace_period: 30s
    # Navidrome only writes to /data (database, cache); everything else stays
    # read-only. If startup fails with "read-only file system" or "permission
    # denied", `docker logs navidrome` names the path or permission it needs.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ:-Europe/Athens}"
      ND_MUSICFOLDER: /music/default
      # Network shares don't deliver file-change events, so new music on the
      # share is only found by a scheduled scan.
      ND_SCANNER_SCHEDULE: "${ND_SCANNER_SCHEDULE:-@every 1h}"
    volumes:
      - data:/data
      - music:/music:ro
    networks:
      - navidrome
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Each transcoded stream runs its own ffmpeg process, and library scans
          # of large collections need headroom — 128M is too tight for either.
          # noinspection ComposeUnknownValues
          cpus: "${NAVIDROME_CPU_LIMIT:-2}"
          # noinspection ComposeUnknownValues
          memory: "${NAVIDROME_MEMORY_LIMIT:-512M}"
          # noinspection ComposeUnknownValues
          pids: ${NAVIDROME_PIDS_LIMIT:-256}
        reservations:
          # noinspection ComposeUnknownValues
          memory: "${NAVIDROME_MEMORY_RESERVATION:-64M}"
    labels:
      - "traefik.enable=true"
      # Router (TLS comes from the websecure entrypoint's wildcard default)
      - "traefik.http.routers.navidrome.rule=Host(`${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.routers.navidrome.service=navidrome"
      - "traefik.http.routers.navidrome.middlewares=navidrome-ipallowlist,strict-path@file"
      # Middlewares — defaults lock out everyone on both IPv4 and IPv6 until you
      # set the allowlists.
      - "traefik.http.middlewares.navidrome-ipallowlist.ipallowlist.sourcerange=${IPV4_ALLOWLIST:-127.0.0.1/32},${IPV6_ALLOWLIST:-::1/128}"
      # Service
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"

networks:
  navidrome:
    name: navidrome

volumes:
  data:
    name: navidrome-data
  music:
    name: navidrome-music
    driver: local
    driver_opts:
      type: "${MUSIC_MOUNT_TYPE:?MUSIC_MOUNT_TYPE is required}"
      o: "${MUSIC_MOUNT_O:?MUSIC_MOUNT_O is required}"
      device: "${MUSIC_MOUNT_DEVICE:?MUSIC_MOUNT_DEVICE is required}"
